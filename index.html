<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<title>Journal</title>
<style>
@font-face{font-family:"Atkinson";src:url("font.woff2") format("woff2");font-weight:400;font-display:block}

:root{
  --bg:#0D0D0D;
  --accent:#F368AD;   /* icon bright — accents only, never body text */
  --bright:#C4709C;   /* body text: easier on the eye at paragraph length */
  --mid:#913B66;
  --deep:#652042;
  --core:#FAD6F0;
  --dim:#6B4A5C;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--bright);
  font-family:"Atkinson",system-ui,sans-serif;font-size:16px;line-height:1.45;
  overscroll-behavior:none;
}
button,input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}

#app{display:flex;flex-direction:column;height:100dvh}

/* tabs */
#tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--deep)}
#tabs button{
  flex:1;padding:14px 4px 12px;font-size:14px;color:var(--dim);
  border-bottom:2px solid transparent;
}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#tabs button.on[data-t="set"]{color:var(--deep);border-bottom-color:var(--deep)}

main{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 16px}
main.flush{padding:0}

.hint{color:var(--dim);font-size:13px;padding:10px 0;text-align:center}
.empty{color:var(--mid);padding:48px 8px;text-align:center;font-size:15px}
.empty b{display:block;color:var(--bright);font-weight:400;margin-bottom:6px}

/* generic rows */
.row{
  display:flex;align-items:center;gap:12px;
  padding:14px 0;border-bottom:1px solid #1E1419;
}
.row.sel{background:#1A1015;box-shadow:inset 3px 0 0 var(--accent)}
.grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--mid)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* commitments */
.bar{height:6px;background:#1E1419;border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.done .bar i{background:var(--core)}
.done .name{color:var(--core)}
.plus{
  flex:0 0 auto;width:44px;height:44px;border-radius:22px;
  border:1px solid var(--deep);color:var(--accent);font-size:20px;line-height:1;
}
.plus[disabled]{color:var(--dim);border-color:#1E1419}

/* journal stream */
#stream{display:flex;flex-direction:column;gap:10px;padding:14px 16px 18px}
.sep{align-self:center;font-size:12px;color:var(--dim);padding:10px 0 4px}
.msg{
  align-self:flex-start;max-width:88%;
  background:#171014;border-left:2px solid var(--deep);
  border-radius:0 10px 10px 0;padding:9px 12px;white-space:pre-wrap;word-wrap:break-word;
}
.msg.sel{background:#2A1A24;border-left-color:var(--accent)}
.msg time{display:block;font-size:11px;color:var(--dim);margin-top:5px}

#composer{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--deep);
}
#composer textarea{
  flex:1;resize:none;max-height:40vh;padding:10px 12px;
  background:#171014;border-radius:12px;line-height:1.4;
}
#composer button{
  flex:0 0 auto;width:44px;height:44px;border-radius:22px;
  background:var(--accent);color:var(--bg);font-size:19px;
}

/* editor */
.editor{display:flex;flex-direction:column;height:100%;padding:0 16px 16px}
.editor input{padding:16px 0 10px;font-size:19px;border-bottom:1px solid var(--deep)}
.editor textarea{flex:1;resize:none;padding:14px 0;line-height:1.6}

/* action bar */
#bar{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--deep);background:#171014;
}
#bar .count{flex:1;color:var(--mid);font-size:14px}
#bar button{padding:8px 14px;border:1px solid var(--deep);border-radius:8px}

/* drop-up */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:10}
#drop{
  width:100%;background:#171014;border-top:1px solid var(--deep);
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
}
#drop h3{margin:0 0 14px;font-weight:400;font-size:15px;color:var(--mid)}
#drop .set{display:flex;gap:10px}
#drop .set button{flex:1;padding:15px 0;border:1px solid var(--deep);border-radius:10px;text-align:center}

/* settings */
.doc h2{font-size:15px;font-weight:400;color:var(--core);margin:26px 0 8px}
.doc p{margin:0 0 10px;max-width:62ch}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:5px}
.doc,.doc *{color:var(--mid)}
.doc h2{color:var(--bright)}
hr{border:none;border-top:1px solid #1E1419;margin:30px 0 6px}
.act{
  display:block;width:100%;text-align:left;padding:16px 0;
  border-bottom:1px solid #1E1419;color:var(--bright);
}
.act small{display:block;color:var(--mid);font-size:12px}
#dump{width:100%;height:34vh;background:#171014;border-radius:10px;padding:10px;margin-top:12px;font-size:12px}

/* add form */
.add{display:flex;gap:10px;padding:16px 0 26px;align-items:center}
.add input{flex:1;min-width:0;padding:11px 12px;background:#171014;border-radius:10px}
.add input.h{flex:0 0 76px;text-align:center}
.add button{width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--bg);font-size:19px}

@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}
</style>
</head>
<body>
<div id="app">
  <nav id="tabs"></nav>
  <main id="view"></main>
  <div id="foot"></div>
</div>

<script>
"use strict";

const APP = "journal", KEY = "j_data", VER = "V1";   // bump here and in sw.js — the only two places
const fmt = m => Math.floor(m/60) + "h " + (m%60) + "m";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- data ---------- */

const blank = { v:1, entries:[], docs:[], commitments:[] };
let data = blank;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    data = {
      v:1,
      entries: Array.isArray(p.entries) ? p.entries : [],
      docs: Array.isArray(p.docs) ? p.docs : [],
      commitments: Array.isArray(p.commitments) ? p.commitments : []
    };
  }catch(e){
    alert("Journal could not read its saved data. Nothing was overwritten. Restore from a backup before adding anything new.");
  }
}

function save(){
  const json = JSON.stringify(data);
  try{
    localStorage.setItem(KEY, json);
    if(localStorage.getItem(KEY) !== json) throw 0;
  }catch(e){
    alert("SAVE FAILED — export your data now (Settings › Export Journal)");
    return false;
  }
  return true;
}

/* ---------- state & layers ---------- */

const state = { tab:"com", layers:[], draft:null };
const topLayer = () => state.layers[state.layers.length-1] || null;

function push(layer){
  state.layers.push(layer);
  history.pushState({d:state.layers.length}, "");
  render();
}
function back(){ history.back(); }

window.addEventListener("popstate", () => {
  if(!state.layers.length) return;          // root: the app exits, as intended
  closeLayer(state.layers.pop());
  render();
});

function closeLayer(l){
  if(l.k === "doc") commitDraft();
}

/* ---------- helpers ---------- */

function longPress(el, fn){
  let t = null, moved = false;
  const clear = () => { clearTimeout(t); t = null; };
  el.addEventListener("touchstart", () => {
    moved = false;
    t = setTimeout(() => { if(!moved){ navigator.vibrate && navigator.vibrate(12); fn(); } }, 480);
  }, {passive:true});
  el.addEventListener("touchmove", () => { moved = true; clear(); }, {passive:true});
  el.addEventListener("touchend", clear);
  el.addEventListener("touchcancel", clear);
  el.addEventListener("contextmenu", e => e.preventDefault());
}

function selecting(){ const l = state.layers.find(x => x.k === "sel"); return l && l.on === state.tab ? l : null; }

function toggleSel(id){
  const s = selecting();
  if(!s) return;
  s.ids.has(id) ? s.ids.delete(id) : s.ids.add(id);
  if(!s.ids.size) back(); else render();
}

function startSel(id){
  if(selecting()) return;
  push({ k:"sel", on:state.tab, ids:new Set([id]) });
}

function el(tag, cls, txt){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt != null) n.textContent = txt;
  return n;
}

const dayKey = ts => new Date(ts).toDateString();
function dayLabel(ts){
  const d = new Date(ts), now = new Date();
  if(dayKey(ts) === now.toDateString()) return "Today";
  if(dayKey(ts) === new Date(now - 864e5).toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short", year:
    d.getFullYear() === now.getFullYear() ? undefined : "numeric"});
}
const clock = ts => new Date(ts).toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit"});

/* ---------- render ---------- */

const vTabs = document.getElementById("tabs");
const vMain = document.getElementById("view");
const vFoot = document.getElementById("foot");

const TABS = [["com","Commitments"],["jnl","Journal"],["doc","Docs"],["set","Settings"]];

function render(){
  const l = topLayer();
  vMain.className = "";
  vMain.innerHTML = "";
  vFoot.innerHTML = "";

  if(l && l.k === "doc"){ vTabs.style.display = "none"; renderEditor(l); paintScrim(null); return; }
  vTabs.style.display = "";

  renderTabs();
  ({com:renderCom, jnl:renderJnl, doc:renderDocs, set:renderSet})[state.tab]();

  const s = selecting();
  if(s) renderBar(s);
  paintScrim(state.layers.find(x => x.k === "drop"));
}

function renderTabs(){
  vTabs.innerHTML = "";
  for(const [id,label] of TABS){
    const b = el("button", state.tab === id ? "on" : "", label);
    b.dataset.t = id;
    b.onclick = () => { if(state.tab !== id){ if(selecting()) back(); state.tab = id; render(); } };
    vTabs.appendChild(b);
  }
}

function renderBar(s){
  const bar = el("div"); bar.id = "bar";
  bar.appendChild(el("span","count", s.ids.size + " selected"));
  const del = el("button", null, "Delete");
  del.onclick = () => {
    const n = s.ids.size;
    if(!confirm("Delete " + n + (n === 1 ? " item?" : " items?"))) return;
    const keep = x => !s.ids.has(x.id);
    if(s.on === "jnl") data.entries = data.entries.filter(keep);
    if(s.on === "doc") data.docs = data.docs.filter(keep);
    if(s.on === "com") data.commitments = data.commitments.filter(keep);
    save(); back();
  };
  const cancel = el("button", null, "Cancel");
  cancel.onclick = back;
  bar.append(del, cancel);
  vFoot.appendChild(bar);
}

/* ---------- commitments ---------- */

function renderCom(){
  const s = selecting();

  if(!data.commitments.length){
    const e = el("div","empty");
    e.appendChild(el("b", null, "No commitments yet."));
    e.appendChild(document.createTextNode("Name something you're learning and give it an hour goal. Minutes add up by tapping +."));
    vMain.appendChild(e);
  }

  for(const c of data.commitments){
    const done = c.minutes >= c.goal;
    const row = el("div","row" + (done ? " done" : "") + (s && s.ids.has(c.id) ? " sel" : ""));

    const body = el("div","grow");
    body.appendChild(el("div","name trunc", c.label));
    body.appendChild(el("div","sub", fmt(c.minutes) + " of " + fmt(c.goal) + (done ? " — complete" : "")));
    const bar = el("div","bar");
    const fill = el("i");
    fill.style.width = Math.min(100, c.goal ? c.minutes/c.goal*100 : 0) + "%";
    bar.appendChild(fill);
    body.appendChild(bar);
    body.onclick = () => { s ? toggleSel(c.id) : push({k:"edit", id:c.id}); };

    const add = el("button","plus","+");
    add.disabled = done;
    add.onclick = e => { e.stopPropagation(); if(!done && !s) push({k:"drop", id:c.id}); };

    row.append(body, add);
    longPress(row, () => startSel(c.id));
    vMain.appendChild(row);

    if(topLayer() && topLayer().k === "edit" && topLayer().id === c.id) vMain.appendChild(editPanel(c));
  }

  if(!s){
    vMain.appendChild(addCommit());
    vMain.appendChild(el("div","hint","Tap a commitment to edit it · Hold to select"));
  }
}

function addCommit(){
  const w = el("div","add");
  const name = el("input"); name.placeholder = "New commitment";
  const hrs = el("input","h"); hrs.type = "number"; hrs.min = "1"; hrs.placeholder = "hrs";
  const go = el("button", null, "+");
  go.onclick = () => {
    const label = name.value.trim(), h = parseInt(hrs.value, 10);
    if(!label || !h || h < 1) return;
    data.commitments.push({ id:uid(), label, goal:h*60, minutes:0 });
    if(save()) render();
  };
  w.append(name, hrs, go);
  return w;
}

function editPanel(c){
  const p = el("div");
  p.style.cssText = "padding:14px 0 20px;border-bottom:1px solid #1E1419";

  const goalRow = el("div","add");
  goalRow.style.paddingTop = "0";
  const g = el("input","h"); g.type = "number"; g.min = "1"; g.value = Math.round(c.goal/60);
  const lab = el("span","sub","Hour goal");
  lab.style.flex = "1";
  const set = el("button", null, "✓");
  set.onclick = () => {
    const h = parseInt(g.value, 10);
    if(!h || h < 1) return;
    c.goal = h*60;
    if(save()) render();
  };
  goalRow.append(lab, g, set);
  p.appendChild(goalRow);

  const sub = el("div","set");
  sub.style.cssText = "display:flex;gap:10px;margin:4px 0 14px";
  for(const [label, m] of [["−15m",15],["−30m",30],["−1h",60]]){
    const b = el("button", null, label);
    b.style.cssText = "flex:1;padding:13px 0;border:1px solid var(--deep);border-radius:10px";
    b.onclick = () => { c.minutes = Math.max(0, c.minutes - m); if(save()) render(); };
    sub.appendChild(b);
  }
  p.appendChild(sub);

  const reset = el("button","act","Reset to zero");
  reset.style.borderBottom = "none";
  reset.onclick = () => {
    if(!confirm("Set " + c.label + " back to 0h 0m?")) return;
    c.minutes = 0; if(save()) render();
  };
  p.appendChild(reset);

  const close = el("button","act","Close");
  close.style.cssText = "border-bottom:none;color:var(--mid)";
  close.onclick = back;
  p.appendChild(close);
  return p;
}

/* ---------- drop-up ---------- */

function paintScrim(layer){
  const old = document.getElementById("scrim");
  if(old) old.remove();
  if(!layer) return;
  const c = data.commitments.find(x => x.id === layer.id);
  if(!c) return;

  const scrim = el("div"); scrim.id = "scrim";
  scrim.onclick = e => { if(e.target === scrim) back(); };
  const drop = el("div"); drop.id = "drop";
  drop.appendChild(el("h3", null, c.label + " — " + fmt(c.minutes)));
  const set = el("div","set");
  for(const [label, m] of [["+15m",15],["+30m",30],["+1h",60]]){
    const b = el("button", null, label);
    b.onclick = () => { c.minutes = Math.min(c.goal, c.minutes + m); save(); back(); };
    set.appendChild(b);
  }
  drop.appendChild(set);
  scrim.appendChild(drop);
  document.body.appendChild(scrim);
}

/* ---------- journal ---------- */

function renderJnl(){
  const s = selecting();
  vMain.className = "flush";

  if(!data.entries.length){
    const e = el("div","empty");
    e.appendChild(el("b", null, "The log is empty."));
    e.appendChild(document.createTextNode("Write the first line whenever you're ready. Entries stay exactly as written."));
    vMain.appendChild(e);
  }

  const stream = el("div"); stream.id = "stream";
  let last = null;
  for(const en of data.entries){
    if(dayKey(en.ts) !== last){
      last = dayKey(en.ts);
      stream.appendChild(el("div","sep", dayLabel(en.ts)));
    }
    const m = el("div","msg" + (s && s.ids.has(en.id) ? " sel" : ""));
    m.appendChild(document.createTextNode(en.text));
    const t = el("time", null, clock(en.ts));
    m.appendChild(t);
    m.onclick = () => { if(s) toggleSel(en.id); };
    longPress(m, () => startSel(en.id));
    stream.appendChild(m);
  }
  if(data.entries.length) stream.appendChild(el("div","hint","Hold an entry to select · Entries cannot be edited"));
  vMain.appendChild(stream);

  if(!s){
    const c = el("div"); c.id = "composer";
    const ta = el("textarea");
    ta.rows = 1; ta.placeholder = "Write to the log";
    ta.oninput = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    const send = el("button", null, "↑");
    send.onclick = () => {
      const text = ta.value.trim();
      if(!text) return;
      data.entries.push({ id:uid(), text, ts:Date.now() });
      if(!save()) return;
      ta.value = ""; ta.style.height = "auto";
      render(); vMain.scrollTop = vMain.scrollHeight;
    };
    c.append(ta, send);
    vFoot.appendChild(c);
  }
  requestAnimationFrame(() => { vMain.scrollTop = vMain.scrollHeight; });
}

/* ---------- docs ---------- */

function renderDocs(){
  const s = selecting();

  if(!data.docs.length){
    const e = el("div","empty");
    e.appendChild(el("b", null, "No documents yet."));
    e.appendChild(document.createTextNode("One document per theme. Title it, then write as long as you like."));
    vMain.appendChild(e);
  }

  for(const d of data.docs){
    const row = el("div","row" + (s && s.ids.has(d.id) ? " sel" : ""));
    const body = el("div","grow");
    body.appendChild(el("div","trunc", d.title || "Untitled"));
    body.appendChild(el("div","sub", "Edited " + dayLabel(d.updated).toLowerCase() + " · " + clock(d.updated)));
    body.onclick = () => { s ? toggleSel(d.id) : push({k:"doc", id:d.id}); };
    row.appendChild(body);
    longPress(row, () => startSel(d.id));
    vMain.appendChild(row);
  }

  if(!s){
    const w = el("div","add");
    const name = el("input"); name.placeholder = "New document";
    const go = el("button", null, "+");
    const make = () => {
      const title = name.value.trim();
      if(!title) return;
      const d = { id:uid(), title, body:"", updated:Date.now() };
      data.docs.unshift(d);
      if(save()){ name.value = ""; push({k:"doc", id:d.id}); }
    };
    go.onclick = make;
    w.append(name, go);
    vMain.appendChild(w);
    vMain.appendChild(el("div","hint","Tap to open · Hold to select"));
  }
}

function renderEditor(layer){
  const d = data.docs.find(x => x.id === layer.id);
  if(!d){ back(); return; }

  const wrap = el("div","editor");
  const title = el("input"); title.value = d.title; title.placeholder = "Title";
  const body = el("textarea"); body.value = d.body; body.placeholder = "Write here.";

  state.draft = { id:d.id, title, body, dirty:false };
  const mark = () => { state.draft.dirty = true; };
  title.oninput = mark; body.oninput = mark;

  const bar = el("div"); bar.id = "bar";
  const status = el("span","count","Saves when you leave");
  const saveBtn = el("button", null, "Save");
  saveBtn.onclick = () => { if(commitDraft(true)) status.textContent = "Saved"; };
  const close = el("button", null, "Back");
  close.onclick = back;
  bar.append(status, saveBtn, close);

  wrap.append(title, body);
  vMain.className = "flush";
  vMain.style.overflow = "hidden";
  vMain.appendChild(wrap);
  vFoot.appendChild(bar);
}

function commitDraft(force){
  const dr = state.draft;
  if(!dr) return false;
  if(!dr.dirty && !force){ state.draft = null; return true; }
  const d = data.docs.find(x => x.id === dr.id);
  if(d){
    d.title = dr.title.value.trim();
    d.body = dr.body.value;
    d.updated = Date.now();
  }
  const ok = save();
  dr.dirty = false;
  if(!force) state.draft = null;
  return ok;
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && state.draft) commitDraft(true);
});

/* ---------- settings ---------- */

function renderSet(){
  const doc = el("div","doc");
  const H = t => doc.appendChild(el("h2", null, t));
  const P = t => doc.appendChild(el("p", null, t));
  const UL = items => {
    const u = el("ul");
    for(const i of items) u.appendChild(el("li", null, i));
    doc.appendChild(u);
  };

  H("What Journal is for");
  P("Journal is the app of persistence — half text, half accountability. It holds three things and nothing else.");
  UL([
    "Commitments — what you're learning, measured in hours.",
    "The Journal — one permanent log about The Work.",
    "Docs — long-form writing, one document per theme."
  ]);

  H("Commitments");
  P("Name a commitment, give it an hour goal, and add time as you spend it. Short sessions count — that's the point of the fifteen-minute step.");
  UL([
    "Tap + on a commitment for +15m, +30m or +1h.",
    "Tap the commitment itself to change the goal, subtract time you added by mistake, or reset it to zero.",
    "At the goal the bar fills and adding stops. Raise the goal to keep going."
  ]);
  P("This counter is independent of Harvest. Fill the Harvest hour when you intend to study; add the time here once the focus actually held.");

  H("The Journal");
  P("One log, permanent, in its own app because of what it's about. Write as you'd message someone. Enter starts a new line; the arrow sends.");
  P("Entries cannot be edited once sent. They can be deleted — hold one to select, then delete. The log can forget, but it can't be rewritten.");

  H("Docs");
  P("Tap a document to open it full screen. It saves when you leave it, switch tabs, or lock the phone, and Save writes it immediately if you'd rather be sure.");

  H("Everywhere in the suite");
  UL([
    "Hold any item to select it, then tap more to add. Delete removes them all at once.",
    "Swipe from the edge or use the back gesture to close what's open — it won't drop you out of the app from a sub-view.",
    "Nothing here needs a connection. Offline is the normal case.",
    "Nothing is displayed as debt. An untouched commitment is just an untouched commitment."
  ]);

  H("Before every version bump");
  P("Export, push the new files, open the app, tap Force update. Export is the only thing that survives a dead phone or evicted storage.");
  P("Journal never reads or writes another app's data, and no other app touches Journal's. Restore replaces everything in Journal at once — it is not a way to recover one entry.");

  vMain.appendChild(doc);
  vMain.appendChild(el("hr"));

  const act = (label, sub, fn) => {
    const b = el("button","act");
    b.appendChild(document.createTextNode(label));
    b.appendChild(el("small", null, sub));
    b.onclick = fn;
    vMain.appendChild(b);
  };

  act("Export Journal", "Save a JSON file of everything in this app", doExport);
  act("Restore Journal", "Replace everything in this app from a file", doRestore);
  act("Force update", "Reinstall the newest version. Your data is untouched.", () => {
    if(confirm("Reinstall Journal from the server? Your data stays.")) forceUpdate();
  });

  vMain.appendChild(el("div","hint","Journal " + VER + " · " +
    data.entries.length + " entries · " +
    data.docs.length + " docs · " +
    data.commitments.length + " commitments"));
}

function doExport(){
  const json = JSON.stringify(data, null, 2);
  const name = "journal-" + new Date().toISOString().slice(0,10) + ".json";
  try{
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = el("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){
    showDump(json);
  }
}

function showDump(json){
  const old = document.getElementById("dump");
  if(old) old.remove();
  const ta = el("textarea"); ta.id = "dump"; ta.value = json; ta.readOnly = true;
  vMain.appendChild(ta);
  ta.scrollIntoView({block:"nearest"});
  ta.select();
  alert("Download was blocked. Copy the text below instead.");
}

function doRestore(){
  const f = el("input"); f.type = "file"; f.accept = "application/json,.json";
  f.onchange = () => {
    const file = f.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      let p;
      try{ p = JSON.parse(r.result); }
      catch(e){ alert("That file isn't valid JSON. Nothing was changed."); return; }
      if(!p || !Array.isArray(p.entries) || !Array.isArray(p.docs) || !Array.isArray(p.commitments)){
        alert("That file isn't a Journal export. Nothing was changed.");
        return;
      }
      const msg = "Replace everything in Journal with this file?\n\n" +
        "In the file: " + p.entries.length + " entries, " + p.docs.length + " docs, " + p.commitments.length + " commitments.\n" +
        "Right now: " + data.entries.length + " entries, " + data.docs.length + " docs, " + data.commitments.length + " commitments.\n\n" +
        "What's here now is discarded.";
      if(!confirm(msg)) return;
      data = { v:1, entries:p.entries, docs:p.docs, commitments:p.commitments };
      if(save()) render();
    };
    r.readAsText(file);
  };
  f.click();
}

async function forceUpdate(){
  try{
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
    const keys = await caches.keys();
    await Promise.all(keys.filter(k => k.startsWith(APP)).map(k => caches.delete(k)));
  }catch(e){}
  location.reload();
}

/* ---------- boot ---------- */

load();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
  });
}
</script>
</body>
</html>
